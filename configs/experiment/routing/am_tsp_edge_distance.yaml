# @package _global_

defaults:
  - override /model: am_tsp_edge_distance.yaml
  - override /env: tsp.yaml
  - override /callbacks: default.yaml
  - override /trainer: default.yaml
  - override /logger: tensorboard.yaml

env:
  generator_params:
    num_loc: 50

logger:
  tensorboard:
    _target_: lightning.pytorch.loggers.TensorBoardLogger
    name: am-tsp50-edge-distance

model:
  batch_size: 512
  val_batch_size: 1024
  test_batch_size: 1024
  train_data_size: 512_000
  val_data_size: 10_000
  test_data_size: 10_000
  optimizer_kwargs:
    lr: 1e-4
    weight_decay: 1e-6
  lr_scheduler:
    "MultiStepLR"
  lr_scheduler_kwargs:
    milestones: [80, 95]
    gamma: 0.1

trainer:
  max_epochs: 100

seed: 1234
