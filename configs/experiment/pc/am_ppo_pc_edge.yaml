# @package _global_

defaults:
  - override /model: am_ppo_pc_edge.yaml
  - override /env: pc.yaml
  - override /callbacks: default.yaml
  - override /trainer: default.yaml
  - override /logger: tensorboard.yaml

model:
  generate_default_data: false
  batch_size: 1000
  val_batch_size: 1000
  test_batch_size: 1000
  train_data_size: 5000
  val_data_size: 1000
  test_data_size: 1000
  optimizer_kwargs:
    lr: 1e-4
    weight_decay: 1e-6

trainer:
  max_epochs: 30
  enable_progress_bar: false
  enable_model_summary: false

callbacks:
  rich_progress_bar: null
  model_summary: null
  tensorboard_logger:
    _target_: rl4co.utils.callbacks.tensorboard_logger.TensorBoardLogger
    train_metrics: ["reward", "loss", "surrogate_loss", "value_loss", "value_loss_term", "entropy", "entropy_loss"]
    val_metrics: ["reward", "loss"]
    test_metrics: ["reward"]
    train_decode_check: true
    train_groups:
      ppo_loss_terms: ["loss", "surrogate_loss", "value_loss_term", "entropy_loss"]
  nco_test_result_writer:
    _target_: rl4co.utils.callbacks.nco_test_result_writer.NCOTestResultWriter
    output_dir: ${paths.output_dir}/test_results
    filename: nco_test_results.csv
    algorithm: ppo_edge_no_compat_no_mask

seed: 1234
