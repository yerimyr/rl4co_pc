_target_: rl4co.models.AttentionModel

baseline: "rollout"

policy_kwargs:
  embed_dim: 128
  num_encoder_layers: 3
  num_heads: 8
  encoder:
    _target_: rl4co.models.nn.graph.pc_encoder.PCSplitHybridEncoder
    embed_dim: ${model.policy_kwargs.embed_dim}
    num_layers: ${model.policy_kwargs.num_encoder_layers}
    num_heads: ${model.policy_kwargs.num_heads}
    env_name: pc
    edge_input_dim: 5
    include_connection_feature: true
    use_message_mask: false
    normalization: batch
