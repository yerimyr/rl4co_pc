_target_: rl4co.models.POMO

# PC does not use geometric dihedral augmentation by default.
num_augment: 1
num_starts: 4

policy_kwargs:
  embed_dim: 128
  num_encoder_layers: 3
  num_heads: 8
  normalization: "batch"
  use_graph_context: True
  encoder:
    _target_: rl4co.models.nn.graph.pc_encoder.PCEdgeAwareEncoder
    embed_dim: ${model.policy_kwargs.embed_dim}
    num_layers: ${model.policy_kwargs.num_encoder_layers}
    env_name: pc
    edge_input_dim: 8
    use_compat_mask: false
    use_message_mask: false
    include_connection_feature: true
    aggregation: weighted
    exclude_sep_from_encoder: true

metrics:
  train: ["loss", "reward", "max_reward"]
  val: ["reward", "max_reward"]
  test: ${model.metrics.val}
  log_on_step: True
